<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE14D"/>
      <stop offset="1" stop-color="#FFC400"/>
    </linearGradient>
    <filter id="shC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7a5a00" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="640" height="640" fill="url(#bgC)"/>
  <!-- back bubble (white), offset up-left: "someone asked" -->
  <g filter="url(#shC)">
    <path fill="#FFFFFF" d="M150 170 h220 a50 50 0 0 1 50 50 v110 a50 50 0 0 1 -50 50 h-150 l-52 46 v-46 h-18 a50 50 0 0 1 -50 -50 v-110 a50 50 0 0 1 50 -50 z"/>
  </g>
  <!-- front bubble (blue), offset down-right: "the community confirms" -->
  <g filter="url(#shC)">
    <path fill="#0B57C8" d="M270 260 h220 a50 50 0 0 1 50 50 v110 a50 50 0 0 1 -50 50 h-18 v46 l-52 -46 h-150 a50 50 0 0 1 -50 -50 v-110 a50 50 0 0 1 50 -50 z"/>
  </g>
  <path d="M322 368 L 364 410 L 440 330" fill="none" stroke="#FFD400" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- three dots in the back bubble -->
  <circle cx="185" cy="240" r="15" fill="#0B57C8" opacity="0.35"/>
  <circle cx="232" cy="240" r="15" fill="#0B57C8" opacity="0.35"/>
  <circle cx="279" cy="240" r="15" fill="#0B57C8" opacity="0.35"/>
</svg>
