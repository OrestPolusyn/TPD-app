<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1767D6"/>
      <stop offset="1" stop-color="#0A3F9E"/>
    </linearGradient>
    <filter id="shA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#021a4a" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="640" fill="url(#bgA)"/>
  <!-- ground shadow under the pin -->
  <ellipse cx="320" cy="522" rx="78" ry="16" fill="#021a4a" opacity="0.35"/>
  <!-- pin -->
  <path filter="url(#shA)" fill="#FFD400"
        d="M320 512 C 262 432 172 360 172 262 A148 148 0 1 1 468 262 C 468 360 378 432 320 512 Z"/>
  <!-- check -->
  <path d="M250 262 L 300 312 L 392 216" fill="none" stroke="#0B4DB8" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
